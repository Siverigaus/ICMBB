## These are specified by CHARMM

exclude scaled1-4
1-4scaling 1.0
## You have some freedom choosing the cutoff

switching on
switchdist 8.0
# may use smaller, maybe 10, with PME
cutoff 12.0

## Promise that atom won't move more than 1.5A in a cycle

pairlistdist 13.5

## redo pairlists every twenty steps

stepspercycle 40
margin 2.0

### PME (for full-system periodic electrostatics)

PME on
PMETolerance 0.000001

## manually specify grid

PMEGridSizeX   144 
PMEGridSizeY   144  
PMEGridSizeZ   180
fullElectFrequency  4

## Periodic Boundary conditions

cellBasisVector1 145.88 0.0 0.0 
cellBasisVector2 0.0 145.88 0.0
cellBasisVector3 0.0 0.0 196.84
cellOrigin 0.0 0.0 0.0

# constant pressure control (variable volume)

useGroupPressure yes
useFlexibleCell yes
useConstantRatio yes

langevinPiston on
langevinPistonTarget 1.01325
langevinPistonPeriod 2000.0
langevinPistonDecay 1000.0
langevinPistonTemp 310

# constant temperature control

langevin on
langevinDamping 10.0
langevinTemp 310
langevinHydrogen off

# wrap other molecules too

wrapAll on

timestep 2.0

rigidBonds all
rigidTolerance 1e-5
rigidIterations 500

## continuing a run (run stops when this step is reached)

numsteps 50000000

seed 2026083040

outputenergies 50000

dcdfreq 50000
dcdfile dcd/MD_no_bonds_W_I_PMm_100_ns_3.dcd

binaryoutput no
outputname pdb/MD_no_bonds_W_I_PMm_100_ns_3

set restart on
set restartname pdb/MD_no_bonds_W_I_PMm_100_ns_3
set restartfreq 50000